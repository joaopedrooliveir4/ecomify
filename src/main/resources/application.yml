spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:ecomify
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081


api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}

logging:
  level:
    org.springframework.security: DEBUG